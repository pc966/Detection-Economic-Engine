<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Economics - SOC Login</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cyberpunk Glowing Animation */
        @keyframes glow {
            0% { border-color: #3b82f6; box-shadow: 0 0 5px #3b82f6; }
            50% { border-color: #8b5cf6; box-shadow: 0 0 20px #8b5cf6, inset 0 0 10px #8b5cf6; }
            100% { border-color: #3b82f6; box-shadow: 0 0 5px #3b82f6; }
        }
        .glow-border {
            animation: glow 3s infinite alternate;
        }
        .glass-effect {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Dynamic Background Particles (Dots) -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-10 left-10 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
        <div class="absolute bottom-10 right-10 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse delay-1000"></div>
    </div>

    <!-- Login Card -->
    <div class="glass-effect relative z-10 w-full max-w-md p-8 rounded-2xl shadow-2xl border border-gray-700 glow-border">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/20 text-blue-400 text-3xl mb-4">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                Detection Economics
            </h1>
            <p class="text-gray-400 text-sm mt-1">Blue Team Security Operations</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-3 bg-red-900/50 border border-red-500/50 rounded text-red-200 text-sm text-center">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2" for="username">
                    <i class="fas fa-user mr-2 text-blue-400"></i> Username
                </label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-white placeholder-gray-500"
                    placeholder="Enter username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2" for="password">
                    <i class="fas fa-lock mr-2 text-blue-400"></i> Password
                </label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-white placeholder-gray-500"
                    placeholder="Enter password">
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold rounded-lg shadow-lg hover:shadow-blue-500/30 transition duration-300 transform hover:-translate-y-0.5">
                <i class="fas fa-arrow-right-to-bracket mr-2"></i> Secure Login
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-gray-500">
            <p>Secured by Flask &bull; v2.0 Production Ready</p>
        </div>
    </div>
</body>
</html>
